appId: dev.castant.chibipos
productName: chibipos

# Output directory for electron-builder
directories:
  output: dist/builder
  app: dist/electron

  # Include all files from the 'app' directory (dist/electron)
files:
  - filter:
      - "**/*"
  - "!**/*.map"
  - "!node_modules/@electron/**"

# Files to unpack from asar archive
asarUnpack:
  - "**/*.node"
  - "node_modules/sqlite3/**"
  - "node_modules/gsap/**"

# Extra files to be copied to the resources directory
extraResources:
  - from: ./database.sqlite
    to: database.sqlite

win:
  executableName: chibipos
  # target:
  #   - target: nsis
  #     arch:
  #       - x64
  #       - ia32 # If you need 32-bit
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  notarize: false # Set to true if you have Apple Developer ID and want to notarize
  target:
    - target: dmg
      arch:
        - x64
        - arm64 # For Apple Silicon
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  maintainer: guillermo <gcastant@gmail.com>
  category: Utility

appImage:
  artifactName: ${name}-${version}.${ext}
